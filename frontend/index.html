<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKMAerial</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <canvas id="globe"></canvas>
    <aside id="brand-dock">
        <div id="brand-title">&#x1F916; J.A.R.V.I.S. <span id="brand-state">(ONLINE)</span></div>
        <div id="brand-model">Model: Claude-Haiku-4.5</div>
    </aside>
    <div id="app">
        <div id="orb-container">
            <div id="orb" class="offline">
                <svg class="layer halo" viewBox="0 0 300 300" aria-hidden="true">
                    <defs>
                        <radialGradient id="haloGrad">
                            <stop offset="45%" class="glow-stop" stop-opacity="0.5"/>
                            <stop offset="100%" class="glow-stop" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <circle cx="150" cy="150" r="150" fill="url(#haloGrad)"/>
                </svg>
                <svg class="layer ring spin-a" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="tick tick-fine" cx="150" cy="150" r="145" pathLength="360"/>
                    <circle class="tick tick-major" cx="150" cy="150" r="145" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-b" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="arcs arcs-thin" cx="150" cy="150" r="130" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-c" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="dots" cx="150" cy="150" r="118" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-d" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="arcs arcs-thick" cx="150" cy="150" r="104" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-e" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="tick tick-hair" cx="150" cy="150" r="92" pathLength="360"/>
                </svg>
                <svg class="layer core" viewBox="0 0 300 300" aria-hidden="true">
                    <defs>
                        <radialGradient id="discGrad">
                            <stop offset="0%" class="disc-b"/>
                            <stop offset="75%" class="disc-b"/>
                            <stop offset="100%" class="disc-a"/>
                        </radialGradient>
                    </defs>
                    <circle class="core-line" cx="150" cy="150" r="80"/>
                    <circle cx="150" cy="150" r="68" fill="url(#discGrad)"/>
                    <circle class="core-rim" cx="150" cy="150" r="68"/>
                    <text id="core-name" class="core-name" x="150" y="157" text-anchor="middle">RKMAERIAL</text>
                </svg>
            </div>
        </div>
        <div id="hud-label" class="offline">OFFLINE</div>
        <div id="model-badge"></div>
        <div id="status">Click the orb to speak</div>
    </div>
    <section id="log-panel" aria-label="Conversation">
        <div id="log-title">TRANSCRIPT</div>
        <div id="transcript"></div>
        <div id="sources"></div>
    </section>
    <div id="tasks">
        <div id="tasks-title">Tasks (0)</div>
        <ul id="tasks-list"></ul>
    </div>
    <div id="report-panel" hidden>
        <div id="report-bar">
            <span id="report-title">Report</span>
            <button id="report-close" type="button" aria-label="Close report" title="Close">&times;</button>
        </div>
        <div id="report-body"></div>
    </div>
    <form id="control-bar" autocomplete="off">
        <input id="text-input" type="text" placeholder="Type a message to Jarvis..." aria-label="Message">
        <button id="cdp-toggle" class="ctl" type="button" title="Check Chrome debug port 9222" aria-label="Check Chrome debug port 9222">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/></svg>
        </button>
        <button id="layout-toggle" class="ctl" type="button" title="Show or hide the globe" aria-label="Show or hide the globe">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
        <button id="bell" class="ctl" type="button" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21a2 2 0 0 0 4 0"/></svg>
            <span id="bell-badge" hidden>0</span>
        </button>
        <button id="ear" class="ctl" type="button" title="Listening indicator" aria-label="Listening indicator" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9a5 5 0 0 1 10 0c0 2.5-2 3.2-2.6 5-.5 1.600-1.400 3-3.400 3a2.500 2.500 0 0 1-2.500-2.500M10 9a2 2 0 0 1 4 0"/></svg>
        </button>
        <button id="mic-toggle" class="ctl" type="button" title="Toggle microphone (M)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>
            <span id="mic-label">Mic on</span>
        </button>
    </form>
    <div id="hint">Drag the globe to rotate &middot; click a yellow node for its portfolio</div>
    <div id="broker-popup" hidden>
        <div id="broker-card">
            <div id="broker-bar">
                <span id="broker-title">Portfolio</span>
                <button id="broker-close" type="button" aria-label="Close" title="Close">&times;</button>
            </div>
            <div id="broker-body"></div>
        </div>
    </div>
    <script>
    // Background globe: wireframe sphere with the Northbean hub and clickable brokerage nodes.
    (() => {
        // Report HTML is cleaned server-side and shown only in an iframe with an empty sandbox and an inline-styles-only CSP.
        const REPORT_CSP = "default-src 'none'; style-src 'unsafe-inline'";
        const REPORT_BASE_CSS = 'html,body{margin:0;background:#0a0f16;color:#cfe3f5;font:13px/1.45 Segoe UI,Arial,sans-serif}'
            + 'body{padding:10px}table{border-collapse:collapse;width:100%}'
            + 'th,td{border:1px solid #1a3a5c;padding:4px 8px;text-align:left}th{background:#0d1b2a;color:#4a9eff}'
            + 'h1,h2,h3,h4{color:#4a9eff;margin:12px 0 6px}hr{border:0;border-top:1px solid #1a3a5c}'
            + 'pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.45 Consolas,monospace}';

        const canvas = document.getElementById('globe');
        const ctx = canvas.getContext('2d');
        const popup = document.getElementById('broker-popup');
        const popupTitle = document.getElementById('broker-title');
        const popupBody = document.getElementById('broker-body');
        let W = 0, H = 0, R = 0, RX = 0, CX = 0, CY = 0, dpr = 1;
        let nodes = [], links = [], byId = {};
        let yaw = 0, pitch = -0.35;
        let dragging = false, lastX = 0, lastY = 0, moved = 0;
        let hovered = null, busy = false;
        const AUTO_SPIN = 0.0025;      // radians per frame
        const NODE_ORBIT = 1.3;        // vertical orbit of the child nodes, as a multiple of the wireframe radius
        const NODE_STRETCH = 1.8;      // horizontal orbit is this much wider, so the links run long across the screen
        const ELASTIC = 0.14;          // how far (fraction of the orbit) nodes breathe in and out
        const STRAND_AMP = 11;         // px: how far the two DNA strands swing from the link axis
        const TOP_RESERVE = 20, BOTTOM_RESERVE = 110;   // keep clear of the task panel edge and the control bar + hint

        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Centre the globe in the band between the top margin and the control bar, and size it so the orbiting nodes and labels fit.
            const bandH = Math.max(200, H - TOP_RESERVE - BOTTOM_RESERVE);
            CY = TOP_RESERVE + bandH / 2;
            const app = document.getElementById('app').getBoundingClientRect();
            CX = app.left + app.width / 2;      // centre on the orb, between the brand dock and the log panel
            R = Math.min(Math.min(W, H) * 0.4, (bandH / 2 - 24) / (NODE_ORBIT * (1 + ELASTIC) * 1.15));
            RX = Math.min(R * NODE_ORBIT * NODE_STRETCH, (Math.min(CX, W - CX) - 40) / ((1 + ELASTIC) * 1.15));   // horizontal node orbit, kept on screen
        }
        window.addEventListener('resize', resize);
        resize();

        // Rotate a unit-sphere point by yaw (around Y) then pitch (around X), and project it.
        function project(x, y, z, scale, sx = 1) {
            const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
            const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
            const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
            const persp = 1 / (1 - z2 * 0.25);
            return { x: CX + x1 * scale * sx * persp, y: CY - y2 * scale * persp, z: z2, p: persp };
        }
        function spherePoint(latDeg, lonDeg) {
            const la = latDeg * Math.PI / 180, lo = lonDeg * Math.PI / 180;
            return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
        }

        function drawPolyline(points, color, alphaFront, alphaBack) {
            for (let i = 1; i < points.length; i++) {
                const a = points[i - 1], b = points[i];
                ctx.strokeStyle = color;
                ctx.globalAlpha = (a.z + b.z) / 2 >= 0 ? alphaFront : alphaBack;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
        }

        function drawWireframe() {
            ctx.lineWidth = 1;
            ctx.shadowColor = '#27d9ff'; ctx.shadowBlur = 6;
            for (let lat = -60; lat <= 60; lat += 30) {
                const pts = [];
                for (let lon = 0; lon <= 360; lon += 6) pts.push(project(...spherePoint(lat, lon), R));
                drawPolyline(pts, '#27d9ff', 0.55, 0.12);
            }
            for (let lon = 0; lon < 360; lon += 30) {
                const pts = [];
                for (let lat = -90; lat <= 90; lat += 6) pts.push(project(...spherePoint(lat, lon), R));
                drawPolyline(pts, '#27d9ff', 0.55, 0.12);
            }
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }

        function glowDot(x, y, r, color, glow) {
            const g = ctx.createRadialGradient(x, y, 0, x, y, glow);
            g.addColorStop(0, color); g.addColorStop(0.35, color + '66'); g.addColorStop(1, color + '00');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, glow, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill();
        }

        function frame(t) {
            requestAnimationFrame(frame);
            if (canvas.hidden) return;
            if (!dragging && !hovered) yaw += AUTO_SPIN;
            ctx.clearRect(0, 0, W, H);

            const hub = project(0, 0, 0, R);
            nodes.forEach((n, i) => {
                if (n.type === 'hub') { Object.assign(n, hub, { r: 16 }); return; }
                // Elastic drift: the node breathes in and out and wanders a few degrees, so it never sits still.
                const k = 1 + ELASTIC * Math.sin(t / 1900 + i * 2.1);
                const lat = n.lat + 5 * Math.sin(t / 2600 + i * 1.7), lon = n.lon + 7 * Math.sin(t / 3100 + i * 0.9);
                Object.assign(n, project(...spherePoint(lat, lon), R * NODE_ORBIT * k, RX / (R * NODE_ORBIT)), { r: 11 });
            });

            drawWireframe();

            // Links: two phase-shifted strands twisting around the hub-to-child axis, like a DNA helix; they drift over time.
            ctx.lineWidth = 1.4;
            ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 8;
            ctx.strokeStyle = '#ffd24a';
            links.forEach((l, li) => {
                const a = byId[l.source], b = byId[l.target];
                if (!a || !b) return;
                const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
                const nx = -dy / len, ny = dx / len;
                const turns = Math.max(2, len / 120);
                const sag = 0.12 * len * Math.sin(t / 2200 + li * 1.3);   // the whole strand bows slowly
                ctx.globalAlpha = b.z >= 0 ? 0.8 : 0.25;
                for (const dir of [1, -1]) {
                    ctx.beginPath();
                    for (let s = 0; s <= 40; s++) {
                        const u = s / 40, env = Math.sin(u * Math.PI);
                        const off = env * (STRAND_AMP * dir * Math.sin(u * turns * Math.PI * 2 + t / 700 + li) + sag);
                        const px = a.x + dx * u + nx * off, py = a.y + dy * u + ny * off;
                        if (s) ctx.lineTo(px, py); else ctx.moveTo(px, py);
                    }
                    ctx.stroke();
                }
            });
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;

            // Nodes, far to near
            const pulse = 1 + 0.12 * Math.sin(t / 400);
            for (const n of [...nodes].sort((a, b) => a.z - b.z)) {
                const back = n.type !== 'hub' && n.z < 0;
                ctx.globalAlpha = back ? 0.45 : 1;
                const size = n.r * n.p;
                if (n.type === 'hub') glowDot(n.x, n.y, size, '#27d9ff', size * 3.2 * pulse);
                else glowDot(n.x, n.y, size, '#ffd24a', size * (n === hovered ? 3.4 : 2.6));
                ctx.globalAlpha = back ? 0.5 : 1;
                ctx.fillStyle = n.type === 'hub' ? '#bff4ff' : '#ffe9a6';
                ctx.font = (n.type === 'hub' ? '600 15px' : '13px') + " 'Segoe UI', sans-serif";
                ctx.textAlign = 'center';
                if (n.type !== 'hub') ctx.fillText(n.label, n.x, n.y + size + 18);   // the hub sits behind the HUD orb
            }
            ctx.globalAlpha = 1;
        }

        fetch('/graph/data').then(r => r.json()).then(d => {
            nodes = d.nodes; links = d.links;
            byId = Object.fromEntries(nodes.map(n => [n.id, n]));
        }).catch(() => {});
        requestAnimationFrame(frame);

        function pick(ev) {
            const x = ev.clientX, y = ev.clientY;
            let best = null, bestD = Infinity;
            for (const n of nodes) {
                if (n.type !== 'broker' || n.x === undefined) continue;
                const d = Math.hypot(n.x - x, n.y - y);
                if (d < Math.max(18, n.r * n.p * 1.8) && d < bestD) { best = n; bestD = d; }
            }
            return best;
        }

        canvas.addEventListener('pointerdown', ev => {
            dragging = true; moved = 0; lastX = ev.clientX; lastY = ev.clientY;
            canvas.setPointerCapture(ev.pointerId); canvas.classList.add('drag');
        });
        canvas.addEventListener('pointermove', ev => {
            if (dragging) {
                const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
                moved += Math.abs(dx) + Math.abs(dy);
                yaw += dx * 0.006;
                pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.006));
                lastX = ev.clientX; lastY = ev.clientY;
            } else {
                hovered = pick(ev);
                canvas.classList.toggle('hover', !!hovered);
            }
        });
        canvas.addEventListener('pointerup', ev => {
            dragging = false; canvas.classList.remove('drag');
            if (moved < 5) { const n = pick(ev); if (n) openNode(n); }
        });
        canvas.addEventListener('pointerleave', () => { hovered = null; });

        function showMessage(text, isError) {
            const div = document.createElement('div');
            div.id = 'broker-msg';
            if (isError) div.className = 'err';
            div.textContent = text;
            popupBody.replaceChildren(div);
        }

        function showReport(html) {
            const f = document.createElement('iframe');
            f.setAttribute('sandbox', '');
            f.title = 'Portfolio';
            f.srcdoc = '<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="' + REPORT_CSP
                + '"><meta charset="utf-8"><style>' + REPORT_BASE_CSS + '</style></head><body>' + String(html) + '</body></html>';
            popupBody.replaceChildren(f);
        }

        function closePopup() { popup.hidden = true; popupBody.replaceChildren(); }

        async function openNode(n) {
            popup.hidden = false;
            popupTitle.textContent = n.label;
            if (busy) return;
            busy = true;
            showMessage('Checking your live portfolios… this can take up to a minute.');
            try {
                const res = await fetch('/graph/query/' + encodeURIComponent(n.id), { method: 'POST' });
                const d = await res.json();
                if (d.ok && d.html) showReport(d.html);
                else showMessage(d.note || 'No report available.', true);
            } catch (e) {
                showMessage('Could not reach the server.', true);
            } finally {
                busy = false;
            }
        }

        document.getElementById('broker-close').addEventListener('click', closePopup);
        popup.addEventListener('click', (e) => { if (e.target === popup) closePopup(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !popup.hidden) closePopup(); });
    })();
    </script>
    <script src="/static/main.js"></script>
</body>
</html>
