<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKMAerial</title>
    <link rel="icon" type="image/x-icon" href="/static/jarvis.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <canvas id="globe"></canvas>
    <div id="app">
        <div id="orb-container">
            <div id="orb" class="offline">
                <svg class="layer halo" viewBox="0 0 300 300" aria-hidden="true">
                    <defs>
                        <radialGradient id="haloGrad">
                            <stop offset="45%" class="glow-stop" stop-opacity="0.5"/>
                            <stop offset="100%" class="glow-stop" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <circle cx="150" cy="150" r="150" fill="url(#haloGrad)"/>
                </svg>
                <svg class="layer ring spin-a" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="tick tick-fine" cx="150" cy="150" r="145" pathLength="360"/>
                    <circle class="tick tick-major" cx="150" cy="150" r="145" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-b" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="arcs arcs-thin" cx="150" cy="150" r="130" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-c" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="dots" cx="150" cy="150" r="118" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-d" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="arcs arcs-thick" cx="150" cy="150" r="104" pathLength="360"/>
                </svg>
                <svg class="layer ring spin-e" viewBox="0 0 300 300" aria-hidden="true">
                    <circle class="tick tick-hair" cx="150" cy="150" r="92" pathLength="360"/>
                </svg>
                <svg class="layer core" viewBox="0 0 300 300" aria-hidden="true">
                    <defs>
                        <radialGradient id="discGrad">
                            <stop offset="0%" class="disc-b"/>
                            <stop offset="75%" class="disc-b"/>
                            <stop offset="100%" class="disc-a"/>
                        </radialGradient>
                    </defs>
                    <circle class="core-line" cx="150" cy="150" r="80"/>
                    <circle cx="150" cy="150" r="68" fill="url(#discGrad)"/>
                    <circle class="core-rim" cx="150" cy="150" r="68"/>
                    <text id="core-name" class="core-name" x="150" y="157" text-anchor="middle">RKMAERIAL</text>
                </svg>
            </div>
        </div>
        <div id="hud-label" class="offline">OFFLINE</div>
        <div id="status">Click the robot to speak</div>
    </div>
    <div id="robot" data-power="offline" data-state="idle" role="img" aria-label="Assistant status">
        <img id="robot-img" src="/static/robot.png" alt="" draggable="false">
        <div id="robot-name">RKMAERIAL</div>
        <div id="robot-core">
            <span id="robot-power">OFFLINE</span>
            <span id="robot-sub"></span>
        </div>
    </div>
    <div id="robot-plain" data-power="offline"></div>
    <div id="bubble" data-show="0" data-dots="0" data-speaking="0" aria-hidden="true">
        <div id="bubble-label">RKMAERIAL</div>
        <div id="bubble-text"></div>
        <div id="bubble-dots"><i></i><i></i><i></i></div>
    </div>
    <div id="clock" aria-label="Clock">
        <div id="clock-time"></div>
        <div id="clock-date"></div>
    </div>
    <div id="left-col">
        <div id="tasks">
            <div id="tasks-title">Tasks (0)</div>
            <ul id="tasks-list"></ul>
        </div>
        <div id="sports-panel" hidden>
            <div id="sports-bar">
                <span id="sports-title">Philly Sports Core</span>
                <button id="sports-close" type="button" aria-label="Close sports panel" title="Close">&times;</button>
            </div>
            <div id="sports-body"></div>
        </div>
    </div>
    <div id="report-panel" hidden>
        <div id="report-bar">
            <span id="report-title">Report</span>
            <button id="report-close" type="button" aria-label="Close report" title="Close">&times;</button>
        </div>
        <div id="report-body"></div>
    </div>
    <form id="control-bar" autocomplete="off">
        <input id="text-input" type="text" placeholder="Type a message to Jarvis..." aria-label="Message">
        <button id="cdp-toggle" class="ctl" type="button" title="Check Chrome debug port 9222" aria-label="Check Chrome debug port 9222">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/></svg>
        </button>
        <button id="layout-toggle" class="ctl" type="button" title="Show or hide Tasks" aria-label="Show or hide Tasks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
        <button id="bell" class="ctl" type="button" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21a2 2 0 0 0 4 0"/></svg>
            <span id="bell-badge" hidden>0</span>
        </button>
        <button id="ear" class="ctl" type="button" title="Listening indicator" aria-label="Listening indicator" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9a5 5 0 0 1 10 0c0 2.5-2 3.2-2.6 5-.5 1.600-1.400 3-3.400 3a2.500 2.500 0 0 1-2.500-2.500M10 9a2 2 0 0 1 4 0"/></svg>
        </button>
        <button id="mic-toggle" class="ctl" type="button" title="Toggle microphone (M)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>
            <span id="mic-label">Mic on</span>
        </button>
    </form>
    <div id="belt-pill" style="display:none"><span id="model-badge"></span></div>
    <div id="wa-card" hidden>
        <div id="wa-head"><span id="wa-from">WhatsApp</span><button id="wa-dismiss" type="button" aria-label="Dismiss" title="Dismiss">&times;</button></div>
        <div id="wa-text"></div>
        <div id="wa-hint"></div>
    </div>
    <div id="hint">Drag a node - click a yellow node for its portfolio</div>
    <div id="broker-popup" hidden>
        <div id="broker-card">
            <div id="broker-bar">
                <span id="broker-title">Portfolio</span>
                <button id="broker-close" type="button" aria-label="Close" title="Close">&times;</button>
            </div>
            <div id="broker-body"></div>
        </div>
    </div>
    <script>
    // Background node graph: the Market Scraper hub and clickable brokerage nodes.
    (() => {
        // Report HTML is cleaned server-side and shown only in an iframe with an empty sandbox and an inline-styles-only CSP.
        const REPORT_CSP = "default-src 'none'; style-src 'unsafe-inline'";
        const REPORT_BASE_CSS = 'html,body{margin:0;background:#0a0f16;color:#cfe3f5;font:13px/1.45 Segoe UI,Arial,sans-serif}'
            + 'body{padding:10px}table{border-collapse:collapse;width:100%}'
            + 'th,td{border:1px solid #1a3a5c;padding:4px 8px;text-align:left}th{background:#0d1b2a;color:#4a9eff}'
            + 'h1,h2,h3,h4{color:#4a9eff;margin:12px 0 6px}hr{border:0;border-top:1px solid #1a3a5c}'
            + 'pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.45 Consolas,monospace}';

        const canvas = document.getElementById('globe');
        const ctx = canvas.getContext('2d');
        const popup = document.getElementById('broker-popup');
        const popupTitle = document.getElementById('broker-title');
        const popupBody = document.getElementById('broker-body');
        let W = 0, H = 0, dpr = 1;
        let nodes = [], links = [], byId = {};
        let hovered = null, busy = false;
        const STRAND_AMP = 11;         // px: how far the two DNA strands swing from the link axis
        // --- Layout and motion tuning ---
        const DRIFT = 0.002;     // random wander acceleration (px/frame^2). Lower = calmer. Off under reduced motion.
        const SPRING = 0.0012;   // pull along a link toward LINK_LEN. Higher = stiffer links.
        const REPEL = 0.15;      // soft push between nearby nodes (starts at 1.5 x MIN_GAP). Higher = more breathing room.
        const LINK_LEN = 200;    // px: resting length of every link.
        const MIN_GAP = 120;     // px: nodes are never left closer than this, center to center.
        const DAMPING = 0.94;    // velocity kept per frame. Lower = settles faster.
        const PARALLAX = [28, 18];   // px of mouse-driven shift at full depth (x, y)
        // Free area: x from 280 (just right of the left column) to 40 px left of the robot (the whole space left of it); y from 130 to height minus 170.
        const AREA = { left: 280, top: 130, robotPad: 40, bottomPad: 170 };
        const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
        let reduced = rm.matches;
        rm.addEventListener('change', e => { reduced = e.matches; });
        let area = { l: 0, r: 0, t: 0, b: 0 };   // free box nodes may live in
        let mx = 0, my = 0, tmx = 0, tmy = 0;    // smoothed and target mouse position, -0.5..0.5
        let drag = null, downX = 0, downY = 0, moved = 0, lastT = 0;
        const bubbleEl = document.getElementById('bubble');
        const robotEl = document.getElementById('robot');
        let exclude = null;   // speech-bubble keep-out zone, read from the DOM every frame
        const NODE_OPEN_TYPES = { sports: 1, storage: 1, compactor: 1, digest: 1, oracle: 1, netmap: 1 };
        const isClickable = n => n.type === 'broker' || n.type === 'market-account' || n.type in NODE_OPEN_TYPES;
        const NODE_STYLE = {   // r: radius; color: glow, text: label
            hub: { r: 12, color: '#27d9ff', text: '#bff4ff', font: '600 14px' },
            pipeline: { r: 9, color: '#27d9ff', text: '#bff4ff', font: '12px' },
            broker: { r: 11, color: '#ffd24a', text: '#ffe9a6', font: '13px' },
        };
        NODE_STYLE['market-account'] = NODE_STYLE.broker;
        Object.keys(NODE_OPEN_TYPES).forEach(k => { NODE_STYLE[k] = NODE_STYLE.broker; });
        const ALERT_STYLE = { r: 11, color: '#ff3b4a', text: '#ffb3b8', font: '13px' };
        const styleOf = n => n.alert ? ALERT_STYLE : (NODE_STYLE[n.type] || NODE_STYLE.broker);

        function resize() {
            const old = area;
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const rb = robotEl.getBoundingClientRect();   // zero-sized when the robot is hidden (< 700 px)
            const freeR = (rb.width ? rb.left : W) - AREA.robotPad;
            area = { l: AREA.left, r: Math.max(AREA.left + 200, freeR),
                     t: AREA.top, b: Math.max(AREA.top + 200, H - AREA.bottomPad) };
            if (old.r > old.l) nodes.forEach(n => {   // keep each node at the same relative spot in the new box
                n.sx = area.l + (n.sx - old.l) / (old.r - old.l) * (area.r - area.l);
                n.sy = area.t + (n.sy - old.t) / (old.b - old.t) * (area.b - area.t);
            });
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('pointermove', ev => { tmx = ev.clientX / W - 0.5; tmy = ev.clientY / H - 0.5; });

        // Label size per node, for the collision boxes and the dark label backing.
        function measure(n) {
            const s = styleOf(n);
            ctx.font = s.font + " 'Segoe UI', sans-serif";
            n.lw = ctx.measureText(n.label).width + 12;          // label backing width
            n.hw = Math.max(n.lw / 2, s.r + 6);                  // half width of node + label box
            n.hh = s.r + 14;                                     // half height; box centre sits 10 px below the node
        }

        // The whole cluster is centred horizontally in the free area (left of the robot). The hub is its left end. The pipeline is 220 px from it, up and to the right (toward the robot);
        // the brokers sit on a 120-degree arc 230 px beyond the pipeline (adjacent brokers 230 px apart).
        // The cluster shrinks in small windows and shifts only as far as needed to stay inside the area.
        function place(list) {
            const aw = area.r - area.l, ah = area.b - area.t;
            const hub = list.find(n => n.type === 'hub'), pipe = list.find(n => n.type === 'pipeline');
            const rest = list.filter(n => n !== hub && n !== pipe);
            const put = (n, x, y) => { n.sx = Math.max(area.l, Math.min(area.r, x)); n.sy = Math.max(area.t, Math.min(area.b, y)); };
            const PHI = -35 * Math.PI / 180;
            const pdx = pipe ? 220 * Math.cos(PHI) : 0, pdy = pipe ? 220 * Math.sin(PHI) : 0;   // no pipeline: brokers fan out from the hub
            const off = new Map();                    // node -> [dx, dy] from the hub at full size
            if (pipe) off.set(pipe, [pdx, pdy]);
            const ring = rest.length > 5;   // many children: a full ring around the hub instead of a 120-degree arc
            const R = Math.max(230, rest.length * 26);
            rest.forEach((n, i) => {
                const a = ring ? -Math.PI / 2 + i / rest.length * Math.PI * 2
                    : PHI + (rest.length > 1 ? (i / (rest.length - 1) - 0.5) * Math.PI * 2 / 3 : 0);
                off.set(n, [pdx + R * Math.cos(a), pdy + R * Math.sin(a)]);
            });
            const pts = [[0, 0], ...off.values()];
            const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
            const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
            const s = Math.max(0.6, Math.min(1, aw / (maxX - minX + 40), ah / (maxY - minY + 40)));
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const hx = clamp(area.l + aw / 2 - (minX + maxX) / 2 * s, area.l - minX * s, area.r - maxX * s);   // cluster box centred horizontally
            const hy = clamp((area.t + area.b) / 2, area.t - minY * s, area.b - maxY * s);
            if (hub) put(hub, hx, hy);
            off.forEach(([dx, dy], n) => put(n, hx + dx * s, hy + dy * s));
            list.forEach((n, i) => { n.vx = n.vy = 0; n.z = Math.sin(i * 2.7); measure(n); });
        }

        // Push two nodes apart if their centres are closer than MIN_GAP or their label boxes collide.
        // A dragged node never moves; the other one yields.
        function separate(a, b) {
            const dx = b.sx - a.sx, dy = b.sy - a.sy, d = Math.hypot(dx, dy) || 0.01;
            const gap = Math.max(0, MIN_GAP - d);
            let gx = dx / d * gap, gy = dy / d * gap;
            const ox = a.hw + b.hw + 8 - Math.abs(dx), oy = a.hh + b.hh + 8 - Math.abs(dy);
            if (ox > 0 && oy > 0) {
                if (ox < oy) { if (ox > Math.abs(gx)) gx = Math.sign(dx || 1) * ox; }
                else if (oy > Math.abs(gy)) gy = Math.sign(dy || 1) * oy;
            }
            if (!gx && !gy) return;
            const wa = a === drag ? 0 : 1, wb = b === drag ? 0 : 1, w = wa + wb;
            if (!w) return;
            a.sx -= gx * 0.35 * wa / w; a.sy -= gy * 0.35 * wa / w;
            b.sx += gx * 0.35 * wb / w; b.sy += gy * 0.35 * wb / w;
        }

        // Nodes never sit under the speech bubble (the box is fixed-size, so it does not twitch while text types).
        function keepOut(n) {
            if (!exclude) return;
            if (n.sy + 36 > exclude.t && n.sy - 24 < exclude.b && n.sx + n.hw > exclude.l) {
                n.sx = exclude.l - n.hw;
                if (n.vx > 0) n.vx = 0;
            }
        }

        // Gentle physics: wander (off under reduced motion), springs along links, soft repulsion, separation, soft walls.
        function step(t, k) {
            const rest = LINK_LEN;
            const cx = (area.l + area.r) / 2, cy = (area.t + area.b) / 2;
            nodes.forEach((n, i) => {
                n.ax = (cx - n.sx) * 0.0001; n.ay = (cy - n.sy) * 0.0001;
                if (!reduced) { n.ax += DRIFT * Math.sin(t / 3100 + i * 1.7); n.ay += DRIFT * Math.cos(t / 2700 + i * 2.3); }
            });
            for (const l of links) {
                const a = byId[l.source], b = byId[l.target];
                if (!a || !b) continue;
                const dx = b.sx - a.sx, dy = b.sy - a.sy, d = Math.hypot(dx, dy) || 1, f = SPRING * (d - rest);
                a.ax += f * dx / d; a.ay += f * dy / d; b.ax -= f * dx / d; b.ay -= f * dy / d;
            }
            const range = MIN_GAP * 1.5;
            for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
                const a = nodes[i], b = nodes[j];
                const dx = b.sx - a.sx, dy = b.sy - a.sy, d = Math.hypot(dx, dy);
                if (d >= range) continue;
                const s = (1 - d / range) * REPEL, ux = d ? dx / d : 1, uy = d ? dy / d : 0;
                a.ax -= s * ux; a.ay -= s * uy; b.ax += s * ux; b.ay += s * uy;
            }
            for (const n of nodes) {
                if (n === drag) continue;
                n.vx = (n.vx + n.ax * k) * Math.pow(DAMPING, k); n.vy = (n.vy + n.ay * k) * Math.pow(DAMPING, k);
                n.sx += n.vx * k; n.sy += n.vy * k;
            }
            for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) separate(nodes[i], nodes[j]);
            for (const n of nodes) {   // soft walls
                if (n === drag) continue;
                if (n.sx < area.l) { n.sx = area.l; n.vx = Math.abs(n.vx) * 0.3; }
                if (n.sx > area.r) { n.sx = area.r; n.vx = -Math.abs(n.vx) * 0.3; }
                if (n.sy < area.t) { n.sy = area.t; n.vy = Math.abs(n.vy) * 0.3; }
                if (n.sy > area.b) { n.sy = area.b; n.vy = -Math.abs(n.vy) * 0.3; }
                keepOut(n);
            }
        }

        function glowDot(x, y, r, color, glow) {
            const g = ctx.createRadialGradient(x, y, 0, x, y, glow);
            g.addColorStop(0, color); g.addColorStop(0.35, color + '66'); g.addColorStop(1, color + '00');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, glow, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill();
        }

        function frame(t) {
            requestAnimationFrame(frame);
            if (canvas.hidden) return;
            const k = Math.min(32, t - lastT || 16.7) / 16.7; lastT = t;
            ctx.clearRect(0, 0, W, H);
            const bb = bubbleEl.getBoundingClientRect();
            exclude = bb.width ? { l: bb.left - 20, t: bb.top - 20, b: bb.top + 120 + 20 } : null;   // 120 px = three lines
            step(t, k);
            mx += (tmx - mx) * 0.05 * k; my += (tmy - my) * 0.05 * k;
            const par = reduced ? 0 : 1;
            for (const n of nodes) { n.x = n.sx + mx * PARALLAX[0] * n.z * par; n.y = n.sy + my * PARALLAX[1] * n.z * par; n.p = 1 + 0.1 * n.z; }
            const tt = reduced ? 0 : t;   // frozen link wave and pulse under reduced motion

            // Links: two phase-shifted strands twisting around the node-to-node axis, like a DNA helix.
            ctx.lineWidth = 1.4;
            links.forEach((l, li) => {
                const a = byId[l.source], b = byId[l.target];
                if (!a || !b) return;
                const col = isClickable(b) ? '#ffd24a' : '#27d9ff';
                ctx.shadowColor = col; ctx.shadowBlur = 8; ctx.strokeStyle = col;
                const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
                const nx = -dy / len, ny = dx / len;
                const turns = Math.max(2, len / 120);
                const sag = 0.12 * len * Math.sin(tt / 2200 + li * 1.3);   // the whole strand bows slowly
                ctx.globalAlpha = 0.45 + 0.3 * (a.z + b.z + 2) / 4;
                for (const dir of [1, -1]) {
                    ctx.beginPath();
                    for (let s = 0; s <= 40; s++) {
                        const u = s / 40, env = Math.sin(u * Math.PI);
                        const off = env * (STRAND_AMP * dir * Math.sin(u * turns * Math.PI * 2 + tt / 700 + li) + sag);
                        const px = a.x + dx * u + nx * off, py = a.y + dy * u + ny * off;
                        if (s) ctx.lineTo(px, py); else ctx.moveTo(px, py);
                    }
                    ctx.stroke();
                }
            });
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;

            const pulse = 1 + 0.12 * Math.sin(tt / 400);
            const order = [...nodes].sort((a, b) => a.z - b.z);
            for (const n of order) {   // pass 1: glow dots
                const s = styleOf(n), size = s.r * n.p;
                ctx.globalAlpha = 0.7 + 0.3 * (n.z + 1) / 2;
                glowDot(n.x, n.y, size, s.color, size * (n.type === 'hub' ? 3.2 * pulse : n === hovered || n === drag ? 3.4 : 2.6));
            }
            ctx.textAlign = 'center';
            for (const n of order) {   // pass 2: labels (hub included) on a faint dark backing, above all dots and links
                const s = styleOf(n), ly = n.y + s.r * n.p + 18;
                ctx.globalAlpha = 0.7 + 0.3 * (n.z + 1) / 2;
                ctx.fillStyle = 'rgba(6, 12, 20, 0.6)';
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(n.x - n.lw / 2, ly - 13, n.lw, 19, 5); else ctx.rect(n.x - n.lw / 2, ly - 13, n.lw, 19);
                ctx.fill();
                ctx.fillStyle = s.text; ctx.font = s.font + " 'Segoe UI', sans-serif";
                ctx.fillText(n.label, n.x, ly);
            }
            ctx.globalAlpha = 1;
        }

        fetch('/graph/data').then(r => r.json()).then(d => {
            nodes = d.nodes; links = d.links;
            byId = Object.fromEntries(nodes.map(n => [n.id, n]));
            place(nodes);
        }).catch(() => {});
        requestAnimationFrame(frame);

        // Nearest node under the pointer (any node can be dragged; only brokerage nodes open a report).
        function hit(ev) {
            let best = null, bestD = Infinity;
            for (const n of nodes) {
                if (n.x === undefined) continue;
                const d = Math.hypot(n.x - ev.clientX, n.y - ev.clientY);
                if (d < Math.max(18, styleOf(n).r * n.p * 1.8) && d < bestD) { best = n; bestD = d; }
            }
            return best;
        }

        canvas.addEventListener('pointerdown', ev => {
            const n = hit(ev);
            if (!n) return;
            drag = n; downX = ev.clientX; downY = ev.clientY; moved = 0; n.vx = n.vy = 0;
            canvas.setPointerCapture(ev.pointerId); canvas.classList.add('drag');
        });
        canvas.addEventListener('pointermove', ev => {
            if (drag) {
                moved = Math.max(moved, Math.hypot(ev.clientX - downX, ev.clientY - downY));
                const par = reduced ? 0 : 1;
                drag.sx = Math.max(area.l, Math.min(area.r, ev.clientX - mx * PARALLAX[0] * drag.z * par));
                drag.sy = Math.max(area.t, Math.min(area.b, ev.clientY - my * PARALLAX[1] * drag.z * par));
                keepOut(drag);
                return;
            }
            const n = hit(ev);
            hovered = n && isClickable(n) ? n : null;
            canvas.classList.toggle('hover', !!hovered);
            canvas.classList.toggle('grab', !!n && !hovered);
        });
        canvas.addEventListener('pointerup', () => {
            if (!drag) return;
            const n = drag; drag = null; canvas.classList.remove('drag');
            if (moved < 5 && isClickable(n)) openNode(n);   // a click, not a drag
        });
        canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('drag'); });
        canvas.addEventListener('pointerleave', () => { hovered = null; });

        function showMessage(text, isError) {
            const div = document.createElement('div');
            div.id = 'broker-msg';
            if (isError) div.className = 'err';
            div.textContent = text;
            popupBody.replaceChildren(div);
        }

        function showReport(html) {
            const f = document.createElement('iframe');
            f.setAttribute('sandbox', '');
            f.title = 'Portfolio';
            f.srcdoc = '<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="' + REPORT_CSP
                + '"><meta charset="utf-8"><style>' + REPORT_BASE_CSS + '</style></head><body>' + String(html) + '</body></html>';
            popupBody.replaceChildren(f);
        }

        function closePopup() { popup.hidden = true; popupBody.replaceChildren(); }

        // --- Module panel (left-side glass): Philly Sports, storage, compactor, Cartagena, oracle and network nodes ---
        // Everything from the server is written with textContent only, never as HTML.
        const sportsPanel = document.getElementById('sports-panel');
        const sportsBody = document.getElementById('sports-body');
        const panelTitle = document.getElementById('sports-title');
        let panelToken = 0;   // a newer panel open makes older async renders stop
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
        const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? Math.round(b / 1e6) + ' MB' : Math.round(b / 1e3) + ' KB';
        const getJSON = async (url, opts) => (await fetch(url, opts)).json();

        function openPanel(title, loading) {
            const left = document.getElementById('left-col'), toggle = document.getElementById('layout-toggle');
            if (left.hidden && toggle) toggle.click();   // the panel lives in the left column
            panelTitle.textContent = title;
            sportsPanel.hidden = false;
            sportsBody.replaceChildren(el('div', 'sp-dim', loading || 'Loading…'));
            return ++panelToken;
        }
        const show = (token, ...nodes) => { if (token === panelToken) sportsBody.replaceChildren(...nodes); };
        const note = (token, text) => show(token, el('div', 'sp-dim', text));
        const button = (label, fn) => { const b = el('button', 'sp-btn', label); b.type = 'button'; b.addEventListener('click', fn); return b; };

        function sportsGame(label, g) {
            const row = el('div', 'sp-game');
            row.append(el('span', 'sp-lbl', label));
            if (!g) { row.append(el('span', 'sp-dim', '-')); return row; }
            const txt = g.state === 'pre' ? `${g.opp} · ${fmtWhen(g.date)}`
                : `${g.opp} · ${g.score}${g.result ? ' ' + g.result : ''} · ${g.state === 'in' ? 'LIVE ' : ''}${g.status}`;
            row.append(el('span', 'sp-txt' + (g.result ? ' sp-' + g.result.toLowerCase() : '') + (g.state === 'in' ? ' sp-live' : ''), txt));
            return row;
        }

        async function openSports() {
            const tk = openPanel('Philly Sports Core', 'Loading live scores…');
            try {
                const d = await getJSON('/graph/sports');
                if (!d.teams.length) return note(tk, 'No Philadelphia teams are in season with games scheduled right now.');
                const frag = d.teams.map(t => {
                    const box = el('section', 'sp-team');
                    box.append(el('h4', '', t.name));
                    if (t.error) box.append(el('div', 'sp-dim', t.error));
                    box.append(sportsGame('Last', t.last), sportsGame('Next', t.next));
                    if (t.division) {
                        box.append(el('div', 'sp-div', t.division.name));
                        t.division.rows.forEach(r => {
                            const line = el('div', 'sp-row' + (r.me ? ' sp-me' : ''));
                            line.append(el('span', '', r.team), el('span', '', r.record));
                            box.append(line);
                        });
                    }
                    return box;
                });
                show(tk, ...frag);
            } catch (e) { note(tk, 'Could not reach the server.'); }
        }

        async function openStorage() {
            const tk = openPanel('Local Storage Auditor', 'Scanning AppData and caches… up to 30 s.');
            try {
                const d = await getJSON('/maint/audit');
                const box = el('section', 'sp-team');
                const pct = Math.round(d.disk.used / d.disk.total * 100);
                box.append(el('div', 'sp-txt', `Disk ${fmtBytes(d.disk.used)} of ${fmtBytes(d.disk.total)} used (${pct}%) · ${fmtBytes(d.disk.free)} free`));
                const bar = el('div', 'sp-bar'); const fill = el('i'); fill.style.width = pct + '%'; bar.append(fill); box.append(bar);
                box.append(el('div', 'sp-div', 'Largest app folders'));
                const max = Math.max(1, ...d.top.map(r => r.bytes));
                d.top.forEach(r => {
                    const row = el('div', 'sp-row' + (r.cache ? ' sp-me' : ''));
                    row.append(el('span', '', r.name + (r.cache ? ' ★' : '')), el('span', '', fmtBytes(r.bytes)));
                    box.append(row);
                    const b = el('div', 'sp-bar thin'); const f = el('i'); f.style.width = Math.max(2, r.bytes / max * 100) + '%'; b.append(f); box.append(b);
                });
                box.append(el('div', 'sp-dim', `★ cache/temp/log-like: ${fmtBytes(d.cacheBytes)}. Read-only audit; nothing is deleted.${d.partial ? ' Partial scan (time limit).' : ''}`));
                show(tk, box);
            } catch (e) { note(tk, 'Audit failed.'); }
        }

        function compactorCard(d) {
            const box = el('section', 'sp-team');
            box.append(el('div', 'sp-txt', `Runs automatically: ${d.schedule}.`));
            box.append(el('div', 'sp-div', 'Databases found'));
            box.append(el('div', 'sp-dim', d.databases.length ? d.databases.join(', ') : 'None yet. Any SQLite file in the Jarvis folder (or data/, logs/) is picked up.'));
            const st = d.state || {};
            box.append(el('div', 'sp-div', 'Last run'));
            box.append(el('div', 'sp-txt', st.last ? `${fmtWhen(st.last)} (${st.trigger})` : 'Never'));
            (st.results || []).forEach(r => {
                const row = el('div', 'sp-row' + (r.ok ? '' : ' sp-l'));
                row.append(el('span', '', r.file), el('span', '', r.ok ? `${fmtBytes(r.before)} → ${fmtBytes(r.after)}` : 'failed'));
                box.append(row);
            });
            return box;
        }
        async function openCompactor() {
            const tk = openPanel('Database Compactor');
            try {
                const d = await getJSON('/maint/compactor');
                const box = compactorCard(d);
                box.append(button('Compact now', async () => {
                    note(tk, 'Vacuuming and reindexing…');
                    try { await getJSON('/maint/compactor/run', { method: 'POST' }); show(tk, compactorCard(await getJSON('/maint/compactor'))); }
                    catch (e) { note(tk, 'Compaction failed.'); }
                }));
                show(tk, box);
            } catch (e) { note(tk, 'Could not reach the server.'); }
        }

        async function openCartagena() {
            const tk = openPanel('Daily Cartagena Digest', 'Gathering Bolívar events, news and COP rates…');
            try {
                const d = await getJSON('/digest/cartagena');
                if (!d.ok) return note(tk, d.note || 'Digest unavailable.');
                const ul = el('ul', 'sp-bullets');
                d.bullets.forEach(b => ul.append(el('li', '', b)));
                show(tk, ul);
            } catch (e) { note(tk, 'Digest unavailable.'); }
        }

        function openOracle() {
            openPanel('AI Self-Dialogue Oracle');
            const ta = el('textarea', 'sp-input'); ta.placeholder = 'Paste a strategy. Two personas will debate it until they agree.'; ta.maxLength = 2000;
            const log = el('div', 'sp-log');
            const go = button('Start debate', async () => {
                const text = ta.value.trim(); if (!text) return;
                go.disabled = true; log.replaceChildren();
                try {
                    const res = await fetch('/oracle/debate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
                    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
                    for (;;) {
                        const { done, value } = await reader.read(); if (done) break;
                        buf += dec.decode(value, { stream: true });
                        let i;
                        while ((i = buf.indexOf('\n')) >= 0) {
                            const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line) continue;
                            const m = JSON.parse(line);
                            const row = el('div', 'sp-turn ' + (m.final ? (m.consensus ? 'sp-w' : 'sp-l') : m.speaker === 'Skeptic' ? 'sp-skeptic' : 'sp-architect'));
                            row.append(el('b', '', m.speaker + ': '), document.createTextNode(m.text));
                            log.append(row); log.scrollTop = log.scrollHeight;
                        }
                    }
                } catch (e) { log.append(el('div', 'sp-l', 'Debate interrupted.')); }
                go.disabled = false;
            });
            sportsBody.replaceChildren(ta, go, log);
        }

        let netNode = null;
        async function openNetwork() {
            const tk = openPanel('Network Device Mapper', 'Pinging the Wi-Fi subnet… about 10 s.');
            try {
                const d = await getJSON('/net/scan');
                if (!d.ok) return note(tk, d.note || 'Scan failed.');
                if (netNode) netNode.alert = d.unknown > 0;   // the node itself turns red while unknown devices are present
                const box = el('section', 'sp-team');
                const head = el('div', 'sp-txt', `${d.subnet} · ${d.devices.length} devices · `);
                head.append(el('span', d.unknown ? 'sp-l' : 'sp-w', d.unknown ? `${d.unknown} unrecognized` : 'all recognized'));
                box.append(head);
                const gw = d.devices.find(x => x.gateway);
                const item = x => {
                    const li = el('li', x.known ? '' : 'sp-alert');
                    li.append(el('span', 'sp-dot'), el('span', '', (x.label || x.host || 'device') + ' '), el('em', '', x.ip + (x.mac ? ' · ' + x.mac : '')));
                    if (!x.known) {
                        li.append(el('b', '', ' ⚠ unrecognized'));
                        li.append(button('Trust', async () => {
                            const label = prompt('Name this device', x.host || 'My device'); if (label === null) return;
                            await getJSON('/net/trust', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mac: x.mac, label }) });
                            openNetwork();
                        }));
                    }
                    return li;
                };
                const tree = el('ul', 'sp-tree'), root = el('li', 'sp-root'), kids = el('ul');
                root.append(el('span', 'sp-dot'), el('span', '', gw ? 'Router ' + gw.ip : 'Router'));
                d.devices.filter(x => !x.gateway).forEach(x => kids.append(item(x)));
                root.append(kids); tree.append(root); box.append(tree);
                box.append(button('Rescan', openNetwork));
                box.append(el('div', 'sp-dim', 'Phones that use a randomized (private) Wi-Fi address look unrecognized until trusted.'));
                show(tk, box);
            } catch (e) { note(tk, 'Scan failed.'); }
        }
        document.getElementById('sports-close').addEventListener('click', () => { sportsPanel.hidden = true; panelToken++; });
        const NODE_OPEN = { sports: openSports, storage: openStorage, compactor: openCompactor, digest: openCartagena, oracle: openOracle, netmap: openNetwork };

        async function openNode(n) {
            if (NODE_OPEN[n.type]) { if (n.type === 'netmap') netNode = n; return NODE_OPEN[n.type](); }
            popup.hidden = false;
            popupTitle.textContent = n.label;
            if (busy) return;
            busy = true;
            showMessage('Checking your live portfolios… this can take up to a minute.');
            try {
                const res = await fetch('/graph/query/' + encodeURIComponent(n.id), { method: 'POST' });
                const d = await res.json();
                if (d.ok && d.html) showReport(d.html);
                else showMessage(d.note || 'No report available.', true);
            } catch (e) {
                showMessage('Could not reach the server.', true);
            } finally {
                busy = false;
            }
        }

        document.getElementById('broker-close').addEventListener('click', closePopup);
        popup.addEventListener('click', (e) => { if (e.target === popup) closePopup(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !popup.hidden) closePopup(); });
    })();
    </script>
    <script src="/static/main.js"></script>
</body>
