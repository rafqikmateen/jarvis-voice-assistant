<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Graph</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #05080d; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        canvas#globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
        canvas#globe.hover { cursor: pointer; }
        canvas#globe.drag { cursor: grabbing; }
        #back {
            position: fixed; top: 20px; left: 20px; z-index: 3;
            background: rgba(13, 27, 42, 0.6); color: #4a9eff; border: 1px solid #1a3a5c; border-radius: 6px;
            padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        #hint { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; color: #4b5a6b; font-size: 12px; pointer-events: none; }
        #card {
            position: fixed; top: 70px; right: 20px; bottom: 20px; width: min(520px, 92vw); z-index: 3;
            display: flex; flex-direction: column; overflow: hidden;
            background: #0a0f16; border: 1px solid #1a3a5c; border-radius: 8px;
            box-shadow: 0 0 30px rgba(39, 217, 255, 0.12);
        }
        #card[hidden] { display: none; }
        #card-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #0d1b2a; color: #4a9eff; font-size: 14px; }
        #card-close { background: none; border: none; color: #4a9eff; font-size: 22px; line-height: 1; cursor: pointer; }
        #card-body { flex: 1; min-height: 0; display: flex; }
        #card-body iframe { width: 100%; height: 100%; border: none; background: #0a0f16; }
        #card-msg { margin: auto; padding: 20px; text-align: center; color: #7fb8e6; font-size: 14px; }
        #card-msg.err { color: #ff6b6b; }
        @media (max-width: 600px) { #card { top: auto; height: 60vh; left: 4vw; right: 4vw; width: auto; } }
    </style>
</head>
<body>
    <canvas id="globe"></canvas>
    <button id="back" type="button" title="Back to assistant">&#9664; Assistant</button>
    <div id="hint">Drag to rotate &middot; click a yellow node for its portfolio</div>
    <div id="card" hidden>
        <div id="card-bar">
            <span id="card-title">Portfolio</span>
            <button id="card-close" type="button" aria-label="Close" title="Close">&times;</button>
        </div>
        <div id="card-body"></div>
    </div>
<script>
(() => {
    // Same sandbox rules as the main page: report HTML is already cleaned server-side and is only ever shown
    // inside an iframe with an empty sandbox and a CSP that allows inline styles only.
    const REPORT_CSP = "default-src 'none'; style-src 'unsafe-inline'";
    const REPORT_BASE_CSS = 'html,body{margin:0;background:#0a0f16;color:#cfe3f5;font:13px/1.45 Segoe UI,Arial,sans-serif}'
        + 'body{padding:10px}table{border-collapse:collapse;width:100%}'
        + 'th,td{border:1px solid #1a3a5c;padding:4px 8px;text-align:left}th{background:#0d1b2a;color:#4a9eff}'
        + 'h1,h2,h3,h4{color:#4a9eff;margin:12px 0 6px}hr{border:0;border-top:1px solid #1a3a5c}'
        + 'pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.45 Consolas,monospace}';

    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('card');
    const cardTitle = document.getElementById('card-title');
    const cardBody = document.getElementById('card-body');
    let W = 0, H = 0, R = 0, dpr = 1;
    let nodes = [];
    let yaw = 0, pitch = -0.35;
    let dragging = false, lastX = 0, lastY = 0, moved = 0;
    let hovered = null, busy = false;
    const AUTO_SPIN = 0.0025;      // radians per frame

    function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        R = Math.min(W, H) * 0.32;
    }
    window.addEventListener('resize', resize);
    resize();

    // Rotate a unit-sphere point by yaw (around Y) then pitch (around X), and project it.
    function project(x, y, z, scale) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
        const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
        const persp = 1 / (1 - z2 * 0.25);
        return { x: W / 2 + x1 * scale * persp, y: H / 2 - y2 * scale * persp, z: z2, p: persp };
    }
    function spherePoint(latDeg, lonDeg) {
        const la = latDeg * Math.PI / 180, lo = lonDeg * Math.PI / 180;
        return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
    }

    function drawPolyline(points, color, alphaFront, alphaBack) {
        for (let i = 1; i < points.length; i++) {
            const a = points[i - 1], b = points[i];
            const front = (a.z + b.z) / 2 >= 0;
            ctx.strokeStyle = color;
            ctx.globalAlpha = front ? alphaFront : alphaBack;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
    }

    function drawWireframe() {
        ctx.lineWidth = 1;
        ctx.shadowColor = '#27d9ff'; ctx.shadowBlur = 6;
        for (let lat = -60; lat <= 60; lat += 30) {
            const pts = [];
            for (let lon = 0; lon <= 360; lon += 6) pts.push(project(...spherePoint(lat, lon), R));
            drawPolyline(pts, '#27d9ff', 0.55, 0.12);
        }
        for (let lon = 0; lon < 360; lon += 30) {
            const pts = [];
            for (let lat = -90; lat <= 90; lat += 6) pts.push(project(...spherePoint(lat, lon), R));
            drawPolyline(pts, '#27d9ff', 0.55, 0.12);
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    function glowDot(x, y, r, color, glow) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, glow);
        g.addColorStop(0, color); g.addColorStop(0.35, color + '66'); g.addColorStop(1, color + '00');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, glow, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill();
    }

    function frame(t) {
        if (!dragging && !hovered) yaw += AUTO_SPIN;
        ctx.clearRect(0, 0, W, H);
        const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        bg.addColorStop(0, '#0a1624'); bg.addColorStop(1, '#05080d');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

        const hub = project(0, 0, 0, R);
        const placed = nodes.map(n => {
            if (n.type === 'hub') return Object.assign(n, hub, { r: 16 });
            const [x, y, z] = spherePoint(n.lat, n.lon);
            return Object.assign(n, project(x, y, z, R), { r: 11 });
        });

        drawWireframe();

        // Links: hub to each child, behind-the-globe links are dimmer.
        const hubNode = placed.find(n => n.type === 'hub');
        ctx.lineWidth = 1.5;
        for (const l of links) {
            const a = byId[l.source], b = byId[l.target];
            if (!a || !b) continue;
            ctx.strokeStyle = '#ffd24a';
            ctx.globalAlpha = b.z >= 0 ? 0.8 : 0.25;
            ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;

        // Nodes, far to near
        const pulse = 1 + 0.12 * Math.sin(t / 400);
        for (const n of [...placed].sort((a, b) => a.z - b.z)) {
            const back = n.type !== 'hub' && n.z < 0;
            ctx.globalAlpha = back ? 0.45 : 1;
            const size = n.r * n.p;
            if (n.type === 'hub') glowDot(n.x, n.y, size, '#27d9ff', size * 3.2 * pulse);
            else glowDot(n.x, n.y, size, '#ffd24a', size * (n === hovered ? 3.4 : 2.6));
            ctx.globalAlpha = back ? 0.5 : 1;
            ctx.fillStyle = n.type === 'hub' ? '#bff4ff' : '#ffe9a6';
            ctx.font = (n.type === 'hub' ? '600 15px' : '13px') + " 'Segoe UI', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText(n.label, n.x, n.y + size + 18);
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
    }

    let links = [], byId = {};
    fetch('/graph/data').then(r => r.json()).then(d => {
        nodes = d.nodes; links = d.links;
        byId = Object.fromEntries(nodes.map(n => [n.id, n]));
        requestAnimationFrame(frame);
    }).catch(() => {
        ctx.fillStyle = '#ff6b6b'; ctx.font = '14px sans-serif';
        ctx.fillText('Could not load /graph/data', 20, 120);
    });

    function pick(ev) {
        const rect = canvas.getBoundingClientRect();
        const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
        let best = null, bestD = Infinity;
        for (const n of nodes) {
            if (n.type !== 'broker' || n.x === undefined) continue;
            const d = Math.hypot(n.x - x, n.y - y);
            if (d < Math.max(18, n.r * n.p * 1.8) && d < bestD) { best = n; bestD = d; }
        }
        return best;
    }

    canvas.addEventListener('pointerdown', ev => {
        dragging = true; moved = 0; lastX = ev.clientX; lastY = ev.clientY;
        canvas.setPointerCapture(ev.pointerId); canvas.classList.add('drag');
    });
    canvas.addEventListener('pointermove', ev => {
        if (dragging) {
            const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
            moved += Math.abs(dx) + Math.abs(dy);
            yaw += dx * 0.006;
            pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.006));
            lastX = ev.clientX; lastY = ev.clientY;
        } else {
            hovered = pick(ev);
            canvas.classList.toggle('hover', !!hovered);
        }
    });
    canvas.addEventListener('pointerup', ev => {
        dragging = false; canvas.classList.remove('drag');
        if (moved < 5) { const n = pick(ev); if (n) openNode(n); }
    });
    canvas.addEventListener('pointerleave', () => { hovered = null; });

    function showMessage(text, isError) {
        const div = document.createElement('div');
        div.id = 'card-msg';
        if (isError) div.className = 'err';
        div.textContent = text;
        cardBody.replaceChildren(div);
    }

    function showReport(html) {
        const frame = document.createElement('iframe');
        frame.setAttribute('sandbox', '');
        frame.title = 'Portfolio';
        frame.srcdoc = '<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="' + REPORT_CSP
            + '"><meta charset="utf-8"><style>' + REPORT_BASE_CSS + '</style></head><body>' + String(html) + '</body></html>';
        cardBody.replaceChildren(frame);
    }

    async function openNode(n) {
        card.hidden = false;
        cardTitle.textContent = n.label;
        if (busy) return;
        busy = true;
        showMessage('Checking your live portfolios… this can take up to a minute.');
        try {
            const res = await fetch('/graph/query/' + encodeURIComponent(n.id), { method: 'POST' });
            const d = await res.json();
            if (d.ok && d.html) showReport(d.html);
            else showMessage(d.note || 'No report available.', true);
        } catch (e) {
            showMessage('Could not reach the server.', true);
        } finally {
            busy = false;
        }
    }

    document.getElementById('card-close').addEventListener('click', () => { card.hidden = true; cardBody.replaceChildren(); });
    document.getElementById('back').addEventListener('click', () => { location.href = '/'; });
})();
</script>
</body>
</html>
